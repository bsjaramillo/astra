# =============================================================================
# Astra Chat Server - Release workflow
# =============================================================================
# Se ejecuta cuando se pushea un tag con formato v* (ej: v0.1.0).
# Construye y publica:
#   1. La imagen Docker (linux/amd64) → ghcr.io
#   2. El GitHub Release con las instrucciones de instalación
#
# Tags de pre-release (vX.Y.Z-alpha*, -beta*, -rc*):
#   - La imagen Docker NO sobreescribe :latest
#   - El GitHub Release se marca como pre-release automáticamente
# =============================================================================
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 0. Prepare: extrae versión y detecta si es pre-release
  # ---------------------------------------------------------------------------
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      is_prerelease: ${{ steps.check.outputs.IS_PRERELEASE }}
    steps:
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Detect pre-release
        id: check
        run: |
          if echo "${GITHUB_REF#refs/tags/v}" | grep -qE -- '-(alpha|beta|rc)(\.[0-9]+)?$'; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # 1. Build + push Docker images multi-arch
  # ---------------------------------------------------------------------------
  docker:
    name: docker (linux/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker_tags
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          REPO=ghcr.io/${{ github.repository_owner }}/astra
          ARCH=${{ matrix.arch }}
          # Siempre se publica con la versión exacta
          TAGS="${REPO}:${VERSION}-${ARCH}"$'\n'"${REPO}:${VERSION}"
          # Solo se pisa :latest en releases estables
          if [ "${{ needs.prepare.outputs.is_prerelease }}" != "true" ]; then
            TAGS="${TAGS}"$'\n'"${REPO}:latest-${ARCH}"$'\n'"${REPO}:latest"
          fi
          {
            echo 'TAGS<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.docker_tags.outputs.TAGS }}
          labels: |
            org.opencontainers.image.title=astra
            org.opencontainers.image.description=Ares Galaxy compatible chat server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 2. Crear el GitHub Release con las instrucciones
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Astra ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Astra ${{ needs.prepare.outputs.version }}

            Servidor de chat compatible con **Ares Galaxy**, escrito en Rust.
            Documentación y guía completa: **https://bsjaramillo.github.io/astra**

            ### Instalación (recomendada): astra-creator

            [astra-creator](https://github.com/${{ github.repository_owner }}/astra-creator)
            es una TUI que crea y administra tus salas sobre Docker.

            ```bash
            # 1. Instalar (necesita docker + docker compose):
            curl -sSL https://raw.githubusercontent.com/${{ github.repository_owner }}/astra-creator/main/install.sh | sh

            # 2. Abrir la TUI y crear tu sala:
            astra-creator /srv/astra-salas
            ```

            En la TUI: `a` agrega una sala (nombre, puerto, owner password y —si
            quieres HTTPS— un dominio), `D` la despliega. Para actualizar una sala
            ya desplegada a esta versión: `u` (o `U` para todas).

            ### Alternativa: Docker manual

            ```bash
            docker run -d \
              --name astra \
              -p 5009:5009 \
              -p 5009:5009/udp \
              -v astra-data:/app/data \
              ghcr.io/${{ github.repository_owner }}/astra:${{ needs.prepare.outputs.version }}
            ```

            O con docker compose:

            ```bash
            curl -O https://raw.githubusercontent.com/${{ github.repository_owner }}/astra/v${{ needs.prepare.outputs.version }}/docker-compose.yml
            docker compose up -d
            ```

            ### Administración

            - **Panel web**: `http://<tu-ip>:<puerto>/admin` con el owner password
              (o `https://<tu-dominio>/admin` si configuraste HTTPS).
            - **Comandos en el chat**: `/login <owner_password>` te hace Owner;
              después `/topic`, `/ban`, `/grant <nick> moderator`, `/help`, etc.

            ### Imagen Docker

            ```
            ghcr.io/${{ github.repository_owner }}/astra:${{ needs.prepare.outputs.version }}
            ```

