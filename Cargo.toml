[workspace]
resolver = "2"
members = [
    "crates/proto-ares",
    "crates/iconnect",
    "crates/server-core",
    "crates/udp",
    "crates/captcha",
    "crates/commands",
    "crates/scripting",
    "crates/web",
    "crates/link",
    "crates/astra",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
authors = ["Astra Project"]
repository = "https://github.com/yourusername/astra"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Binary protocol & encoding
bytes = "1.7"
byteorder = "1.5"

# Networking
tokio-tungstenite = "0.23"
axum = "0.7"
hickory-dns = "0.24"
http = "1.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

# Compression
flate2 = "1.0"
zip = "2.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors & utilities
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.20"
parking_lot = "0.12"
scopeguard = "1.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
url = "2.5"
base64 = "0.22"

# CLI
clap = { version = "4.5", features = ["derive"] }
config = "0.14"

# Crypto / hashing
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"

# Random
rand = "0.8"

# Regex
regex = "1.10"

# JavaScript engine (for plugins)
boa_engine = "0.20"
boa_gc = "0.20"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
