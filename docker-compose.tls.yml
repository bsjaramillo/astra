# docker-compose.tls.yml — Astra + Caddy (HTTPS automático para la web/admin)
#
# Uso:
#   1. Edita el Caddyfile: pon tu dominio real y apunta su DNS a este host.
#   2. docker compose -f docker-compose.tls.yml up -d
#
# Resultado:
#   https://tu-dominio/       -> cliente web (TLS, vía Caddy)
#   https://tu-dominio/admin  -> panel de administración (TLS, vía Caddy)
#   <tu-ip>:5009 (TCP/UDP)    -> clientes Ares (directo, sin TLS por protocolo)

services:
  astra:
    build:
      context: .
      dockerfile: Dockerfile
    image: astra:dev
    container_name: astra-server
    restart: unless-stopped
    # Corre como tu usuario del host para que ./data quede accesible desde el SO.
    # Cambia con: PUID=$(id -u) PGID=$(id -g) docker compose -f docker-compose.tls.yml up -d
    user: "${PUID:-1000}:${PGID:-1000}"
    # 5009 se publica para que los clientes Ares se conecten directo.
    # La superficie web NO se publica aquí: entra por Caddy (abajo).
    ports:
      - "5009:5009"       # TCP clientes Ares
      - "5009:5009/udp"   # UDP room search
    volumes:
      # Bind mount: datos accesibles desde el host en ./data.
      - ./data:/app/data
      - ./astra.toml:/app/astra.toml:ro
    command: ["/app/astra", "--config", "/app/astra.toml"]
    environment:
      RUST_LOG: info

  caddy:
    image: caddy:2-alpine
    container_name: astra-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # ACME HTTP-01 + redirect a HTTPS
      - "443:443"   # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - astra

volumes:
  caddy-data:
  caddy-config:
